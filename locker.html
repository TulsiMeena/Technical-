<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Secure Document Locker</title>
  <link rel="stylesheet" href="locker.css" />
</head>
<body>

  <!-- ============ AUTHENTICATION SCREEN ============ -->
  <div id="auth-screen" class="screen active">
    <h1>Secure Document Locker</h1>
    <p class="subtitle">Authenticate to access your documents</p>

    <!-- TABS -->
    <div class="tabs">
      <button class="tab-btn active" data-tab="pattern">Pattern Lock</button>
      <button class="tab-btn" data-tab="face">Face Lock</button>
      <button class="tab-btn" data-tab="voice">Voice Lock</button>
    </div>

    <!-- PATTERN TAB -->
    <div id="tab-pattern" class="tab-content active">
      <h3>Draw Pattern</h3>
      <canvas id="patternCanvas" width="300" height="300"></canvas>
      <div id="patternMessage" class="message"></div>
      <div class="controls">
        <button id="setPatternBtn" class="btn btn-secondary" style="display:none;">Set as New Pattern</button>
      </div>
    </div>

    <!-- FACE TAB -->
    <div id="tab-face" class="tab-content">
      <h3>Face Verification</h3>
      <div class="video-container">
        <video id="webcam" autoplay playsinline></video>
        <canvas id="snapshotCanvas" style="display:none;"></canvas>
      </div>
      <div id="faceMessage" class="message"></div>
      <div class="controls">
        <button id="verifyFaceBtn" class="btn btn-primary">Verify Face</button>
        <button id="setFaceBtn" class="btn btn-secondary" style="display:none;">Set as Reference Face</button>
      </div>
    </div>

    <!-- VOICE TAB -->
    <div id="tab-voice" class="tab-content">
      <h3>Voice Verification</h3>
      <p class="voice-instruction">Click the microphone and say your secret phrase.</p>
      <div class="mic-container">
        <button id="micBtn" class="mic-btn">🎙️</button>
      </div>
      <div id="voiceTranscript" class="transcript"></div>
      <div id="voiceMessage" class="message"></div>
      <div class="controls">
        <button id="setVoiceBtn" class="btn btn-secondary" style="display:none;">Set as Secret Phrase</button>
      </div>
    </div>

    <div class="reset-area">
        <button id="resetAppBtn" class="btn btn-danger btn-sm">Reset Security (Debug)</button>
    </div>
  </div>

  <!-- ============ DASHBOARD SCREEN (SECURE) ============ -->
  <div id="dashboard-screen" class="screen">
    <div class="header">
      <h2>My Secure Documents</h2>
      <button id="logoutBtn" class="btn btn-secondary">Lock 🔒</button>
    </div>

    <div class="upload-section">
      <h3>Upload Document, Image, or Voice</h3>
      <input type="file" id="fileInput" accept="image/*,application/pdf,audio/*" style="display:none;" />
      <button id="uploadBtn" class="btn btn-primary">Select File</button>
      <div id="uploadMessage" class="message"></div>
    </div>

    <div class="documents-grid" id="documentsGrid">
      <!-- Documents will be populated here -->
    </div>
  </div>

  <!-- ============ DOCUMENT MODAL ============ -->
  <div id="docModal" class="modal">
    <div class="modal-content">
      <span class="close-modal">&times;</span>
      <div id="modalContentArea"></div>
    </div>
  </div>

  <script src="locker.js"></script>
</body>
</html>
